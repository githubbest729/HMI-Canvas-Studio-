<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HMI Canvas Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2327">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HMI Studio">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/styles.css"></head>
<body>
<header class="top"><b class="brand">HMI Canvas Studio</b>
<nav id="tabs"><button data-tab="canvas" class="on">Canvas</button><button data-tab="alarms">Alarms <span id="alarmCount" class="badge">0</span></button><button data-tab="trends">Trends</button><button data-tab="script">Scripting</button><button data-tab="bom">BOM</button></nav>
<button id="installBtn" hidden>Install app</button></header>
<main>
<section id="tab-canvas" class="tab on">
 <aside class="palette" id="palette"></aside>
 <div class="stagewrap"><div class="tools"><select id="tplSel" aria-label="Load template"><option value="">Load template…</option><option value="cooling">District Cooling (Chiller Plant)</option><option value="water">Water / Wastewater (RO &amp; Pumping Station)</option><option value="og">Oil &amp; Gas (Metering Skid)</option></select><button id="btnPipe">Draw pipe</button><button id="btnUndo" title="Ctrl+Z">Undo</button><button id="btnRedo" title="Ctrl+Y">Redo</button><button id="btnExport">Export JSON</button><button id="btnImport">Import JSON</button><button id="btnClear">Clear canvas</button><input type="file" id="fileIn" accept=".json" hidden></div><div id="stage"></div></div>
 <aside class="props" id="props"><p class="muted">Drag a symbol onto the canvas, then select it to edit its tag.</p></aside>
</section>
<section id="tab-alarms" class="tab"><div class="bar"><select id="fLevel"><option value="">All levels</option><option>HH</option><option>H</option><option>L</option><option>LL</option></select><select id="fState"><option value="">All states</option><option>Unacked</option><option>Acked</option></select><button id="ackAll">Acknowledge all</button><button id="clrAck">Clear acknowledged</button></div><table id="alarmTable"><thead><tr><th data-k="time">Time</th><th data-k="tag">Tag</th><th data-k="level">Level</th><th data-k="value">Value</th><th data-k="state">State</th><th></th></tr></thead><tbody></tbody></table></section>
<section id="tab-trends" class="tab"><div class="bar"><button id="trPlay">Pause</button><select id="trScale"><option value="60">1 min</option><option value="300">5 min</option><option value="900">15 min</option></select><span id="legend"></span></div><canvas id="trendCv" width="1100" height="420"></canvas></section>
<section id="tab-script" class="tab"><div class="bar"><button id="runScript">Run</button><button id="stopScript">Stop</button><span class="muted">API: tag("Name"), set("Name", v), log(msg). Runs every second.</span></div><textarea id="scriptSrc" spellcheck="false">// QuickScript-style logic
var lvl = tag("TK_101");
if (lvl !== undefined && lvl > 80) { log("TK_101 high, stopping P_101"); set("P_101", 0); }</textarea><pre id="scriptLog"></pre></section>
<section id="tab-bom" class="tab"><div class="bar"><label>Project type <select id="projType"><option value="dc">District Cooling</option><option value="ww">Water / Wastewater</option><option value="og">Oil &amp; Gas</option><option value="infra">Infrastructure / Power</option><option value="metals">Metals</option><option value="fb">Food &amp; Beverage</option></select></label><button id="bomCsv">Export CSV</button><button id="bomReset">Reset prices</button><span id="projNote" class="muted"></span></div><div id="ioSummary"></div><table id="bomTable"><thead><tr><th>Item</th><th>Qty</th><th>Unit (AED)</th><th>Total (AED)</th></tr></thead><tbody></tbody></table></section>
</main><div id="toasts"></div>
<script src="js/app.js"></script><script src="js/canvas.js"></script><script src="js/alarms.js"></script><script src="js/trends.js"></script><script src="js/bom.js"></script>
</body></html>
